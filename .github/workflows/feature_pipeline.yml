name: Feature Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "realtime"
        type: choice
        options:
          - realtime
          - backfill
      days:
        description: "Number of historical days for backfill"
        required: true
        default: "90"
        type: string
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  
jobs:
  feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          if [ "${{ inputs.mode }}" = "backfill" ]; then
            python -m src.feature_pipeline.pipeline --backfill --days "${{ inputs.days }}"
          else
            python -m src.feature_pipeline.pipeline
          fi
